# CI del portal web: en cada pull request y en cada push a main comprueba que el código
# pase el lint, los tipos y las pruebas, y que compile. No despliega: eso lo hace Vercel.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Pruebas (Vitest)
        run: npm run test

      - name: Build de producción
        run: npm run build
